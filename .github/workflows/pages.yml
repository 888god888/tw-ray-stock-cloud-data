name: 部署 iPhone PWA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["更新台股盤後資料"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 取得網站程式
        uses: actions/checkout@v5

      - name: 下載最新盤後資料到網站
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p docs/data
          gh release download latest -p manifest.json -D docs/data --clobber
          gh release download latest -p snapshot.json.gz -D docs/data --clobber
          test -s docs/data/manifest.json
          test -s docs/data/snapshot.json.gz
          python -m json.tool docs/data/manifest.json >/dev/null
          gzip -t docs/data/snapshot.json.gz

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 建立 Pages 部署檔
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
