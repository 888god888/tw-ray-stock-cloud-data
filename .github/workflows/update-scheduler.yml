name: 盤後資料排程守門員

on:
  workflow_dispatch:
  schedule:
    # 台灣時間 17:31、17:45
    - cron: "31,45 09 * * 1-5"
    # 台灣時間 18:07、18:27、18:47
    - cron: "07,27,47 10 * * 1-5"
    # 台灣時間 19:07、19:27、19:47
    - cron: "07,27,47 11 * * 1-5"
    # 台灣時間 20:07、20:27、20:47
    - cron: "07,27,47 12 * * 1-5"
    # 台灣時間 21:07
    - cron: "07 13 * * 1-5"

permissions:
  contents: read
  actions: write

concurrency:
  group: stock-update-scheduler
  cancel-in-progress: true

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 檢查並啟動盤後資料更新
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Taipei date +%F)"
          CUTOFF_EPOCH="$(TZ=Asia/Taipei date -d "$TODAY 18:00:00" +%s)"
          CHECK_DIR="$RUNNER_TEMP/stock-schedule-check"
          mkdir -p "$CHECK_DIR"
          echo "台灣日期：$TODAY"
          RUNS_JSON="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow cloud-update.yml \
              --limit 20 \
              --json status,conclusion
          )"
          ACTIVE_COUNT="$(
            echo "$RUNS_JSON" |
            jq '[.[] | select(
              .status == "queued" or
              .status == "in_progress" or
              .status == "waiting" or
              .status == "pending" or
              .status == "requested"
            )] | length'
          )"
          if [ "$ACTIVE_COUNT" -gt 0 ]; then
            echo "已有盤後資料更新正在執行或排隊，本次不重複啟動。"
            exit 0
          fi
          LAST_CONCLUSION="$(
            echo "$RUNS_JSON" |
            jq -r 'if length > 0 then .[0].conclusion // "" else "" end'
          )"
          GENERATED_AT=""
          GENERATED_DATE=""
          GENERATED_EPOCH=0
          if gh release download latest \
            --repo "$GITHUB_REPOSITORY" \
            --pattern manifest.json \
            --dir "$CHECK_DIR" >/dev/null 2>&1
          then
            GENERATED_AT="$(jq -r '.generated_at // empty' "$CHECK_DIR/manifest.json")"
            if [ -n "$GENERATED_AT" ]; then
              GENERATED_DATE="$(TZ=Asia/Taipei date -d "$GENERATED_AT" +%F 2>/dev/null || true)"
              GENERATED_EPOCH="$(date -d "$GENERATED_AT" +%s 2>/dev/null || echo 0)"
            fi
          fi
          echo "最新資料產生時間：${GENERATED_AT:-尚無資料}"
          echo "最新資料台灣日期：${GENERATED_DATE:-尚無資料}"
          echo "最近更新結果：${LAST_CONCLUSION:-尚無紀錄}"
          if [ "$GENERATED_EPOCH" -ge "$CUTOFF_EPOCH" ] &&
             [ "$LAST_CONCLUSION" = "success" ]
          then
            echo "今天 18:00 後已成功更新，不需要再次執行。"
            exit 0
          fi
          echo "今天尚未成功更新，啟動更新台股盤後資料。"
          gh workflow run cloud-update.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
          echo "已送出更新工作。"
